server:
  port: ${PORT:8081}

spring:
  application:
    name: nagarbondhu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nagarbondhu_db}
    username: ${DB_USERNAME:nagarbondhu_user}
    password: ${DB_PASSWORD:nagarbondhu_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:NagarBondhuSuperSecretJwtSigningKey2026ChangeInProd!}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
