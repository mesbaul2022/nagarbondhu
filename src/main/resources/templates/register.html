<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — NagarBondhu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <a th:href="@{/}" class="text-decoration-none">
                            <h2 class="fw-bold text-primary mb-1">NagarBondhu</h2>
                        </a>
                        <p class="text-muted">Create a new citizen account</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2" role="alert" th:text="${errorMessage}">
                        Registration failed.
                    </div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required placeholder="Mesbaul Islam">
                            <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email address</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" required placeholder="resident@nagarbondhu.gov.bd">
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" required placeholder="At least 6 characters">
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">Phone Number (Optional)</label>
                            <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="+880-1700-000000">
                            <div th:if="${#fields.hasErrors('phone')}" class="text-danger small mt-1" th:errors="*{phone}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Register</button>
                    </form>

                    <hr class="my-4">
                    <div class="text-center">
                        <p class="text-muted small mb-0">Already have an account? <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Sign in here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
