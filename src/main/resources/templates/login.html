<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — NagarBondhu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <a th:href="@{/}" class="text-decoration-none">
                            <h2 class="fw-bold text-primary mb-1">NagarBondhu</h2>
                        </a>
                        <p class="text-muted">Sign in to your account</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                        Invalid email, password, or account is deactivated.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info py-2" role="alert">
                        You have been signed out successfully.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success py-2" role="alert">
                        Registration successful! Please sign in with your credentials.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Email address</label>
                            <input type="email" class="form-control" id="username" name="username" required autofocus placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
                    </form>

                    <hr class="my-4">
                    <div class="text-center">
                        <p class="text-muted small mb-0">Don't have an account? <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
